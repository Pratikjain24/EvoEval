version: "3.8"

networks:
  sage-net:
    driver: bridge

services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    image: sage-sandbox:1.0
    container_name: sage_sandbox
    user: "1000:1000"
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 1024M
    volumes:
      - ../experiments/sandbox_ws:/workspace:rw

  scorer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scorer
    image: sage-scorer:1.0
    container_name: sage_scorer
    user: "1001:1001"
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 128
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ../experiments/sandbox_ws:/eval_harness/workspace:ro
      - ../tests/hidden_gt:/eval_harness/tests:ro

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: sage-backend:1.0
    container_name: sage_backend
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 128
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - SAGE_API_KEY=${SAGE_API_KEY:-sage-dev-key-change-in-production}
      - DASHBOARD_REQUIRE_AUTH=${DASHBOARD_REQUIRE_AUTH:-false}
      - RATE_LIMIT_READ_PER_MINUTE=${RATE_LIMIT_READ_PER_MINUTE:-120}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ../experiments/runs:/app/experiments/runs:ro
    working_dir: /app
    networks:
      - sage-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: sage-frontend:1.0
    container_name: sage_frontend
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 64
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    networks:
      - sage-net

  # Alias for backward compatibility
  dashboard-backend:
    extends:
      service: backend
