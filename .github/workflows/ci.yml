name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit & property tests
      run: |
        pytest tests/ -v

    - name: Run dry-run CLI test
      run: |
        python -m evaeval.runner.cli tasks validate
        python -m evaeval.runner.cli run --config configs/experiments/pilot.yaml --dry-run

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Sandbox Docker Image
      run: |
        docker build -f docker/Dockerfile.sandbox -t evo-sandbox:latest .

    - name: Build Scorer Docker Image
      run: |
        docker build -f docker/Dockerfile.scorer -t evo-scorer:latest .
