name: CI & External Reproducibility Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Validate Benchmark Tasks Catalog
      run: |
        python -m evaeval.runner.cli tasks validate

    - name: Verify Environment & Pull Remote Pinned Model Revisions (Pilot)
      run: |
        python -m evaeval.runner.cli verify-env --config configs/experiments/pilot.yaml

    - name: Verify Environment & Pull Remote Pinned Model Revisions (Full Study)
      run: |
        python -m evaeval.runner.cli verify-env --config configs/experiments/full_study.yaml

    - name: Run Full Regression Test Suite (165 tests)
      run: |
        pytest tests/ -v --durations=10

    - name: Run Dry-Run Benchmark Execution Harness
      run: |
        python -m evaeval.runner.cli run --config configs/experiments/pilot.yaml --dry-run

    - name: Run External Reproducibility Attestation & Digest Verification
      run: |
        python scripts/verify_reproducibility.py

    - name: Upload Verification Attestation Artifacts (Python 3.10)
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: external-verification-attestation
        path: |
          verification_attestation.json
          EXTERNAL_VERIFICATION.md
        retention-days: 90

  docker-build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Sandbox Container (Pinned Base)
      run: |
        docker build -f docker/Dockerfile.sandbox -t evo-sandbox:1.0 .
        docker inspect --format='{{index .Id}}' evo-sandbox:1.0

    - name: Build Scorer Container (Pinned Base)
      run: |
        docker build -f docker/Dockerfile.scorer -t evo-scorer:1.0 .
        docker inspect --format='{{index .Id}}' evo-scorer:1.0

    - name: Build Backend Application Container (Pinned Base)
      run: |
        docker build -f docker/Dockerfile.backend -t evo-backend:1.0 .
        docker inspect --format='{{index .Id}}' evo-backend:1.0

    - name: Build Frontend Dashboard Container (Pinned Base)
      run: |
        docker build -f docker/Dockerfile.frontend -t evo-frontend:1.0 .
        docker inspect --format='{{index .Id}}' evo-frontend:1.0

    - name: Verify Container Image Digests Match Committed JSON
      run: |
        python scripts/build_and_inspect_images.py --verify

