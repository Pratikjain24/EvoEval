# Alias configuration for Multi-Horizon Sensitivity Extension
# See configs/experiments/horizon_sensitivity.yaml
name: multi_horizon
description: "EvoEval Multi-Horizon Sensitivity Extension: 25-cycle evaluation for G2/G4 drift saturation"
model:
  name: qwen2.5-coder-7b-instruct
  revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  family: qwen
  temperature: 0.2
  top_p: 0.95
  seed: 42

judge:
  enabled: true
  name: llama-3.1-8b-instruct
  revision: "0e9e39f249a16976918f6564b8830bc894c89659"
  family: llama
  temperature: 0.0

sandbox:
  image: evo-sandbox:1.0
  mem: 4g
  cpus: 2
  network: none
  max_steps: 10
  timeout_sec: 45

groups: [G1, G2, G4, G6]
cycles: 25
seeds: [42]

tasks:
  train: 60
  test: 40

max_tasks_per_cycle: 4

budget:
  max_usd_per_run: 50.0
  max_wall_hours: 12.0

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.90
