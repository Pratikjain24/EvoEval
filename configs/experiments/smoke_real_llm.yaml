name: smoke_real_llm
description: "Nightly real-LLM smoke test against live vLLM endpoint on 1-2 tasks"
model:
  name: qwen2.5-coder-7b-instruct
  revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  family: qwen
  temperature: 0.2
  top_p: 0.95
  seed: 42
  api_base: "http://localhost:8000/v1"
  api_key: "EMPTY"

sandbox:
  image: evo-sandbox:1.0
  mem: 4g
  cpus: 2
  network: none
  max_steps: 10
  timeout_sec: 45

groups: [G1, G2]
cycles: 1
seeds: [42]

tasks:
  train: 1
  test: 1

max_tasks_per_cycle: 1

budget:
  max_usd_per_run: 5.0
  max_wall_hours: 1.0

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.90
