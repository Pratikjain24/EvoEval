name: full_study
description: "EvoEval Full Empirical Benchmark: 10 cycles, 3 seeds, 100 tasks"
model:
  name: qwen2.5-coder-7b-instruct
  revision: pinned-sha
  temperature: 0.2
  top_p: 0.95
  seed: 42

sandbox:
  image: evo-sandbox:1.0
  mem: 8g
  cpus: 4
  network: none
  max_steps: 20
  timeout_sec: 60

groups: [G1, G2, G3, G4, G5, G6]
cycles: 10
seeds: [42, 43, 44]

tasks:
  train: 60
  test: 40

budget:
  max_usd_per_run: 200.0
  max_wall_hours: 48.0

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.92
