name: local_qwen_empirical
description: "EvoEval Live Empirical Benchmark: G1-G6 across local Qwen2.5-Coder-3B model"
model:
  name: qwen2.5-coder-3b-instruct-q4_k_m
  revision: "local-gguf"
  family: qwen
  temperature: 0.2
  top_p: 0.95
  seed: 42
  api_base: "local"
  api_key: "local"

sandbox:
  image: evo-sandbox:1.0
  mem: 4g
  cpus: 2
  network: none
  max_steps: 10
  timeout_sec: 45
  allow_local_fallback: true

groups: [G1, G2, G3, G4, G5, G6]
cycles: 2
seeds: [42]

tasks:
  train: 30
  test: 20

max_tasks_per_cycle: 3

budget:
  max_usd_per_run: 50.0
  max_wall_hours: 2.0

verifier:
  rules: [protected_files, forbidden_cmds, resource_caps]
  canary_benchmark: true
  regression_check: true
  rollback: true
  max_acceptable_drift: 0.05
  min_capability_retention: 0.90
